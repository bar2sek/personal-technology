apiVersion: v1
kind: Namespace
metadata:
  name: finance
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-data-pvc
  namespace: finance
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      containers:
        - name: actual-server
          image: actualbudget/actual-server:latest
          ports:
            - containerPort: 5006
              name: http
          volumeMounts:
            - mountPath: /data
              name: actual-data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: actual-data
          persistentVolumeClaim:
            claimName: actual-budget-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: actual-budget-service
  namespace: finance
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5006
      name: http
  selector:
    app: actual-budget
