apiVersion: v1
kind: Namespace
metadata:
  name: finance
  labels:
    # Reject any pod in this namespace that isn't fully hardened
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-data-pvc
  namespace: finance
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: finance
spec:
  replicas: 1
  # The RWO volume can attach to only one pod, so stop the old pod before starting the new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      automountServiceAccountToken: false # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # built-in `node` user of the Node.js base image
        runAsGroup: 1000
        fsGroup: 1000 # makes the mounted volume writable by that user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actual-server
          image: actualbudget/actual-server:26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
          ports:
            - containerPort: 5006
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /data
              name: actual-data
            - mountPath: /tmp
              name: tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: actual-data
          persistentVolumeClaim:
            claimName: actual-budget-data-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# Reached only through Cloudflare Tunnel (finance.bar2sek.com, behind Cloudflare Access).
# The tunnel route, DNS record and Access app are managed in infra-cloud-deployments/terraform/cloudflare.
apiVersion: v1
kind: Service
metadata:
  name: actual-budget-service
  namespace: finance
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5006
      name: http
  selector:
    app: actual-budget
