# Copy to frigate-secrets.yaml (gitignored), fill in, then:
#   kubectl apply -f kubernetes/apps/frigate/frigate-secrets.yaml
# Frigate substitutes any FRIGATE_* env var into config.yml as {FRIGATE_NAME}.
# A UniFi Protect RTSP token is a bearer credential: anyone holding it can
# watch the stream. Find each one in Protect > camera > Settings > Advanced >
# RTSP (enable the High and Low streams; Protect shows one URL per stream).
apiVersion: v1
kind: Secret
metadata:
  name: frigate-cameras
  namespace: frigate
type: Opaque
stringData:
  FRIGATE_CAM01_HIGH_TOKEN: "REPLACE_WITH_PROTECT_HIGH_STREAM_TOKEN"
  FRIGATE_CAM01_LOW_TOKEN: "REPLACE_WITH_PROTECT_LOW_STREAM_TOKEN"
