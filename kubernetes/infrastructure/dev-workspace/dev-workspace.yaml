apiVersion: v1
kind: Namespace
metadata:
  name: dev-workspaces
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: antigravity-dev-workspace-pvc
  namespace: dev-workspaces
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block-nvme
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: antigravity-dev
  namespace: dev-workspaces
  labels:
    app: antigravity-dev
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for ReadWriteOnce PVC attached to persistent storage
  selector:
    matchLabels:
      app: antigravity-dev
  template:
    metadata:
      labels:
        app: antigravity-dev
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: dev-agent
          image: codercom/code-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - --bind-addr=0.0.0.0:8080
            - --auth=none
            - /home/coder/workspace
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOCKER_USER
              value: "coder"
            - name: SHELL
              value: "/bin/bash"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    mkdir -p /home/coder/workspace /home/coder/.local/bin /home/coder/.config/rclone
                    if ! command -v rclone &> /dev/null; then
                      curl -fsSL https://rclone.org/install.sh | sudo bash || true
                    fi
                    if ! command -v cron &> /dev/null; then
                      sudo apt-get update && sudo apt-get install -y cron || true
                    fi
                    sudo service cron start || true

          volumeMounts:
            - name: workspace-storage
              mountPath: /home/coder
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
            limits:
              cpu: "16000m"
              memory: "64Gi"
      volumes:
        - name: workspace-storage
          persistentVolumeClaim:
            claimName: antigravity-dev-workspace-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: antigravity-dev-service
  namespace: dev-workspaces
  labels:
    app: antigravity-dev
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: ssh
      port: 22
      targetPort: 22
  selector:
    app: antigravity-dev
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: antigravity-dev-ingress
  namespace: dev-workspaces
  labels:
    app: antigravity-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/websocket-services: "antigravity-dev-service"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agy.bar2sek.com
      secretName: bar2sek-wildcard-tls
  rules:
    - host: agy.bar2sek.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: antigravity-dev-service
                port:
                  number: 8080

