apiVersion: v1
kind: Namespace
metadata:
  name: dev-workspaces
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: antigravity-dev-workspace-pvc
  namespace: dev-workspaces
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block-nvme
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: antigravity-dev
  namespace: dev-workspaces
  labels:
    app: antigravity-dev
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for ReadWriteOnce PVC attached to persistent storage
  selector:
    matchLabels:
      app: antigravity-dev
  template:
    metadata:
      labels:
        app: antigravity-dev
    spec:
      # Target Supermicro Node 03 to utilize 160GB RAM and 28 vCPUs for builds
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - sm-node-03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dev-agent
          image: ghcr.io/bar2sek/dev-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 22
          env:
            - name: WORKSPACE_DIR
              value: "/workspace"
            - name: CODE_SERVER_AUTH
              value: "none"
            - name: SHELL
              value: "/bin/zsh"
          volumeMounts:
            - name: workspace-storage
              mountPath: /workspace
            - name: workspace-storage
              mountPath: /root/.config/antigravity
              subPath: .config/antigravity
            - name: workspace-storage
              mountPath: /root/.config/code-server
              subPath: .config/code-server
            - name: workspace-storage
              mountPath: /root/.ssh
              subPath: .ssh
            - name: workspace-storage
              mountPath: /root/.rclone
              subPath: .rclone
            - name: workspace-storage
              mountPath: /root/.local
              subPath: .local
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
            limits:
              cpu: "16000m"
              memory: "64Gi"
      volumes:
        - name: workspace-storage
          persistentVolumeClaim:
            claimName: antigravity-dev-workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: antigravity-dev-service
  namespace: dev-workspaces
  labels:
    app: antigravity-dev
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: ssh
      port: 22
      targetPort: 22
  selector:
    app: antigravity-dev
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: antigravity-dev-ingress
  namespace: dev-workspaces
  labels:
    app: antigravity-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/websocket-services: "antigravity-dev-service"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agy.bar2sek.com
      secretName: bar2sek-wildcard-tls
  rules:
    - host: agy.bar2sek.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: antigravity-dev-service
                port:
                  number: 8080

