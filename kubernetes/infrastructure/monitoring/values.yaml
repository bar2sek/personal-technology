# ==============================================================================
# kube-prometheus-stack Helm Values for Talos Linux Homelab (homelab-k8s)
# ==============================================================================

# Global configuration
global:
  rbac:
    create: true

# Replaced by kube-client-cert-rule.yaml: a Talos/Omni component reconnects all
# day with client certs valid for under 30 minutes, which keeps the stock rule's
# 1st-percentile check permanently critical.
defaultRules:
  disabled:
    KubeClientCertificateExpiration: true

# ------------------------------------------------------------------------------
# 1. Prometheus Operator
# ------------------------------------------------------------------------------
prometheusOperator:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------------------
# 2. Prometheus Instance
# ------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Allow Prometheus to discover ServiceMonitors, PodMonitors, and Rules across
    # all namespaces without requiring helm release label matching (critical for Rook-Ceph)
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

    # Retention configuration
    retention: 15d
    retentionSize: 45GiB

    # Storage: Bound to Ceph RBD replicated SATA SSD pool
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Tolerations to allow Prometheus pod to schedule on Supermicro control planes
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1536Mi

# ------------------------------------------------------------------------------
# 3. Node Exporter (DaemonSet for Physical Machine Telemetry)
# ------------------------------------------------------------------------------
nodeExporter:
  enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  hostRootFsMount:
    enabled: true

# ------------------------------------------------------------------------------
# 4. Kube State Metrics
# ------------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# ------------------------------------------------------------------------------
# 5. Talos Linux Static Control-Plane Scrapes Tuning
# ------------------------------------------------------------------------------
# Talos Linux runs controller-manager, scheduler, and proxy in isolated static pods
# with loopback-only or secure-only bindings. We disable direct unauthenticated
# scrapes to prevent false-positive target down alerts.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

# Kubelet scraping over secure HTTPS
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    probes: true
    resource: true
    # Chart default /metrics/resource/v1alpha1 no longer exists on current
    # kubelets (404 -> TargetDown since 2026-09-16).
    resourcePath: /metrics/resource

# ------------------------------------------------------------------------------
# 6. Alertmanager
# ------------------------------------------------------------------------------
alertmanager:
  enabled: true
  # Phone alerts via self-hosted ntfy (docs/106, kubernetes/infrastructure/ntfy).
  # Replaces the chart's default config, so its inhibit rules are copied below.
  config:
    global:
      resolve_timeout: 5m
    time_intervals:
      - name: night
        time_intervals:
          - times:
              - start_time: "22:00"
                end_time: "24:00"
              - start_time: "00:00"
                end_time: "07:00"
            location: America/Chicago
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Dead man's switch: Watchdog always fires, so healthchecks.io is pinged
        # about once a minute. If the pings stop (cluster, power or internet
        # down), healthchecks.io notifies by email/ntfy.sh after ~15 minutes.
        - receiver: healthchecks
          matchers: ['alertname = Watchdog']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - receiver: 'null'
          matchers: ['alertname = InfoInhibitor']
        # Loud, any time; reminds every 4h while still firing.
        - receiver: ntfy-critical
          matchers: ['severity = critical']
          repeat_interval: 4h
        # Quiet. Muted 22:00-07:00: anything still firing at 07:00 is sent then,
        # anything that resolved overnight is never sent.
        - receiver: ntfy-warning
          matchers: ['severity = warning']
          repeat_interval: 24h
          mute_time_intervals: ['night']
    receivers:
      - name: 'null'
      # The ping URL embeds the check's secret UUID, so it is read from the
      # Secret healthchecks-ping-url rather than written here.
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/healthchecks-ping-url/url
            send_resolved: false
      # ntfy's built-in alertmanager template formats the payload. Priority 5
      # (urgent) is a time-sensitive iOS notification with sound; 2 (low) is
      # delivered silently to Notification Center.
      - name: ntfy-critical
        webhook_configs:
          - url: http://ntfy.ntfy.svc.cluster.local/homelab-alerts?template=alertmanager&priority=5&tags=rotating_light
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
      - name: ntfy-warning
        webhook_configs:
          - url: http://ntfy.ntfy.svc.cluster.local/homelab-alerts?template=alertmanager&priority=2&tags=warning
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  alertmanagerSpec:
    # Token for posting to ntfy, written by `just ntfy-auth`. Mounted at
    # /etc/alertmanager/secrets/ntfy-alertmanager-token/token.
    secrets:
      - ntfy-alertmanager-token
      - healthchecks-ping-url # created by hand, see docs/106
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

# ------------------------------------------------------------------------------
# 7. Grafana
# ------------------------------------------------------------------------------
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # Inject OAuth Client Secret from Kubernetes secret
  envFromSecret: grafana-oauth-secret

  # Grafana Server & Generic OAuth (Authentik OIDC)
  grafana.ini:
    server:
      root_url: https://grafana.bar2sek.com
    auth:
      disable_login_form: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      auto_login: false
      client_id: grafana
      scopes: openid profile email
      empty_scopes: false
      auth_url: https://auth.bar2sek.com/application/o/authorize/
      token_url: https://auth.bar2sek.com/application/o/token/
      api_url: https://auth.bar2sek.com/application/o/userinfo/
      role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'"
      role_attribute_strict: false
      allow_assign_grafana_admin: true


  # Persistence backed by Ceph RBD
  persistence:
    enabled: true
    storageClassName: rook-ceph-block
    size: 10Gi
    accessModes: ["ReadWriteOnce"]

  # Tolerations for scheduling
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  # Ingress routing for grafana.bar2sek.com
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.bar2sek.com
    path: /
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "64m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    tls:
      - secretName: bar2sek-wildcard-tls
        hosts:
          - grafana.bar2sek.com

  # Auto-discover dashboards and datasources from ConfigMaps/Secrets
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
