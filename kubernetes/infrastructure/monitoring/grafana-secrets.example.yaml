# ==============================================================================
# Grafana Admin Credentials & Authentik OAuth Client Secret Template
# ==============================================================================
# Copy this file to grafana-secrets.yaml (gitignored) and populate with real secrets:
#   kubectl apply -f grafana-secrets.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "REPLACE_WITH_STRONG_RANDOM_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oauth-secret
  namespace: monitoring
type: Opaque
stringData:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "REPLACE_WITH_AUTHENTIK_OAUTH2_CLIENT_SECRET"
