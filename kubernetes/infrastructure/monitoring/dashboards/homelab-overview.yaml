          "id": 22,
          "type": "table",
          "title": "Active alerts",
          "description": "Every firing Prometheus alert with where it comes from. 'Since' is when it started firing; something firing for weeks is either a real problem being ignored or noise to tune.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1000 * ALERTS_FOR_STATE{alertname!~\"Watchdog|InfoInhibitor\"} * on(alertname) group_left() max by (alertname) (ALERTS{alertstate=\"firing\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "refId": "A",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "alertname": 0,
                  "severity": 1,
                  "namespace": 2,
                  "pod": 3,
                  "deployment": 4,
                  "job": 5,
                  "instance": 6,
                  "Value": 7
                },
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "service": true,
                  "prometheus": true,
                  "uid": true
                },
                "renameByName": {
                  "alertname": "Alert",
                  "severity": "Severity",
                  "namespace": "Namespace",
                  "Value": "Since"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Since"
