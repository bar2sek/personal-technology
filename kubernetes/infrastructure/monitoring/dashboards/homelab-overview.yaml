# Homelab Overview: a single "is everything OK?" dashboard.
# Loaded by the Grafana dashboard sidecar (label grafana_dashboard: "1") into the
# "Homelab" folder. Edit the JSON here, not in the Grafana UI (UI edits are disabled).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: Homelab
data:
  homelab-overview.json: |
    {
      "uid": "homelab-overview",
      "title": "Homelab Overview",
      "tags": [
        "homelab"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 39,
      "editable": false,
      "description": "One-screen health of the homelab. Hover the (i) on any panel for what it means and what to do.",
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Is everything OK?  (all green = nothing to do)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nodes ready",
          "description": "Kubernetes nodes reporting Ready. All 5 should be ready. Red: a node is down or unhealthy; check `kubectl get nodes`.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 5
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Ceph storage",
          "description": "Overall health of the Ceph storage cluster. WARN usually has a known cause listed in the 'Ceph warnings' panel below. ERR means data may be at risk: investigate immediately.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ceph_health_status",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "HEALTHY",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "WARNING",
                      "color": "orange",
                      "index": 1
                    },
                    "2": {
                      "text": "ERROR",
                      "color": "red",
                      "index": 2
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Disks down",
          "description": "Ceph disks (OSDs) that are down, counted two ways and taking the larger: Ceph's own up/down flag, and Rook OSD deployments that are not running. Both are needed because Ceph's exporter stops reporting a disk that has failed completely (seen with osd.5). 0 is normal; anything else means storage is running with less redundancy.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(label_replace((count(ceph_osd_up == 0) or vector(0)), \"src\", \"ceph\", \"\", \"\") or label_replace((count(kube_deployment_status_replicas_unavailable{namespace=\"rook-ceph\",deployment=~\"rook-ceph-osd-.*\"} > 0) or vector(0)), \"src\", \"rook\", \"\", \"\"))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Alerts firing",
          "description": "Prometheus alerts currently firing (the always-on Watchdog heartbeat is excluded). Details in the 'Active alerts' table at the bottom.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Power",
          "description": "Whether any UPS is running on battery. ON BATTERY means mains power is out: the cluster has roughly the runtime shown under 'Power' below.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(network_ups_tools_ups_status{flag=\"OB\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "ON MAINS",
                      "color": "green",
                      "index": 0
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 1,
                    "to": 99,
                    "result": {
                      "text": "ON BATTERY",
                      "color": "red"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Oldest backup",
          "description": "Hours since the least recent successful backup job (S3 and NAS, all datasets). Jobs run nightly, so anything over ~26 hours means a backup was missed.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max((time() - kube_cronjob_status_last_successful_time{namespace=~\"backups|finance\"}) / 3600)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 26
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Nodes",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "System disk used (/var)",
          "description": "Local disk on each node, used for container images, logs and Ceph monitor data. The three small nodes only have 12.5 GiB. Above 85%, Kubernetes starts evicting pods and Ceph warns MON_DISK_LOW.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/var\"} / node_filesystem_size_bytes{mountpoint=\"/var\"}) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Memory used",
          "description": "Share of each node's RAM in use (excluding reclaimable cache).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 11,
          "type": "bargauge",
          "title": "CPU used (5 min avg)",
          "description": "Average CPU busy time per node over the last 5 minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) * on(instance) group_left(nodename) node_uname_info",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 12,
          "type": "row",
          "title": "Backups",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 13,
          "type": "bargauge",
          "title": "Hours since last successful backup",
          "description": "Each nightly backup job: S3 (offsite) and -nas (garage Synology). Green under 26 hours. Red means that job has not succeeded since its last scheduled run; check `kubectl get jobs -n backups` (or -n finance).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(time() - kube_cronjob_status_last_successful_time{namespace=~\"backups|finance\"}) / 3600",
              "legendFormat": "{{cronjob}}",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "min": 0,
              "max": 48,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 26
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "left",
            "sizing": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 23,
          "type": "row",
          "title": "Storage",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 24,
          "type": "gauge",
          "title": "Ceph total",
          "description": "Raw space used across every Ceph disk (NVMe + SSD + HDD), all replicas included. Ceph slows down and eventually refuses writes as disks fill, so plan more disks before 70%.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 4,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * ceph_cluster_total_used_bytes / ceph_cluster_total_bytes",
              "legendFormat": "Ceph total",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showThresholdMarkers": true,
            "showThresholdLabels": false,
            "sizing": "auto",
            "minVizWidth": 75,
            "minVizHeight": 75,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 28,
          "type": "stat",
          "title": "",
          "description": "Raw bytes used and raw capacity of the disks in the dial above, all replicas included.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 4,
            "h": 3
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ceph_cluster_total_used_bytes",
              "legendFormat": "Used",
              "instant": true,
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ceph_cluster_total_bytes",
              "legendFormat": "Total",
              "instant": true,
              "range": false,
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          },
          "options": {
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 25,
          "type": "gauge",
          "title": "NVMe",
          "description": "Raw space used on the NVMe OSDs, all replicas included (rook-ceph-block-nvme and CephFS metadata; 3 copies). This averages the tier: Ceph's nearfull (85%) and full (95%) limits apply per disk, so one disk can fill first; check `ceph osd df` if this is orange.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 22,
            "w": 4,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum(max by (ceph_daemon) (ceph_osd_stat_bytes_used) * on (ceph_daemon) group_left () max by (ceph_daemon) (ceph_osd_metadata{device_class=\"nvme\"})) / sum(max by (ceph_daemon) (ceph_osd_stat_bytes) * on (ceph_daemon) group_left () max by (ceph_daemon) (ceph_osd_metadata{device_class=\"nvme\"}))",
