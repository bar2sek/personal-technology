apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bazzite-gaming-vm
  namespace: vms
  labels:
    app: bazzite-gaming
    special: bazzite-gaming
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: bazzite-gaming
        kubevirt.io/domain: bazzite-gaming-vm
    spec:
      nodeSelector:
        kubernetes.io/hostname: pc-node-05
      domain:
        cpu:
          model: host-passthrough
          cores: 12
          threads: 1
          sockets: 1
        resources:
          requests:
            memory: 16Gi
          limits:
            memory: 16Gi
        devices:
          autoattachGraphicsDevice: false
          disks:
            # Primary OS Target NVMe Block Device (Ceph NVMe Pool)
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          # NVIDIA RTX 4070 + Audio Controller (IOMMU Group 12 VFIO Passthrough)
          gpus:
            - name: rtx4070
              deviceName: nvidia.com/RTX_4070
            - name: rtx4070-audio
              deviceName: nvidia.com/RTX_4070_Audio
          inputs:
            - type: tablet
              bus: usb
              name: tablet
        features:
          acpi: {}
          apic: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
        - name: default
          pod: {}
      volumes:
        # NVMe 1000Gi PVC on Ceph NVMe pool
        - name: rootdisk
          persistentVolumeClaim:
            claimName: windows-gaming-nvme-pvc
---
# Dedicated MetalLB LAN VIP for Sunshine Game Streaming & SSH
apiVersion: v1
kind: Service
metadata:
  name: bazzite-gaming-lan
  namespace: vms
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.10.20.52
spec:
  type: LoadBalancer
  selector:
    kubevirt.io/domain: bazzite-gaming-vm
  ports:
    # SSH Remote Shell / Ansible Automation
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
    # Sunshine Web Configuration UI
    - name: sunshine-ui
      port: 47990
      targetPort: 47990
      protocol: TCP
    # Sunshine HTTPS Web UI / Discovery
    - name: sunshine-https
      port: 47984
      targetPort: 47984
      protocol: TCP
    # Sunshine HTTP
    - name: sunshine-http
      port: 47989
      targetPort: 47989
      protocol: TCP
    # Sunshine Control
    - name: sunshine-ctrl-tcp
      port: 48010
      targetPort: 48010
      protocol: TCP
    # Sunshine RTSP
    - name: sunshine-rtsp
      port: 48010
      targetPort: 48010
      protocol: UDP
    # Sunshine Video Stream
    - name: sunshine-video
      port: 47999
      targetPort: 47999
      protocol: UDP
    # Sunshine Audio Stream
    - name: sunshine-audio
      port: 47998
      targetPort: 47998
      protocol: UDP
    # Sunshine Control Stream
    - name: sunshine-ctrl-udp
      port: 48000
      targetPort: 48000
      protocol: UDP
    # Sunshine Mic Stream
    - name: sunshine-mic
      port: 48002
      targetPort: 48002
      protocol: UDP
