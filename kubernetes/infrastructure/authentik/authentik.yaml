apiVersion: v1
kind: Namespace
metadata:
  name: identity
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secrets
  namespace: identity
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_AUTHENTIK_SECRET_KEY"
  db-password: "authentik_secure_db_password"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-db-pvc
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
---
# PostgreSQL Database for Authentik
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-db
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-db
  template:
    metadata:
      labels:
        app: authentik-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: authentik
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: db-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: authentik-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-db
  namespace: identity
spec:
  selector:
    app: authentik-db
  ports:
    - port: 5432
      targetPort: 5432
---
# Redis for Authentik
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-redis
  template:
    metadata:
      labels:
        app: authentik-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: identity
spec:
  selector:
    app: authentik-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Authentik Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      containers:
        - name: authentik-server
          image: ghcr.io/goauthentik/server:2024.4.2
          args: ["server"]
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret-key
            - name: AUTHENTIK_REDIS__HOST
              value: authentik-redis
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-db
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: db-password
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
---
# Authentik Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:2024.4.2
          args: ["worker"]
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret-key
            - name: AUTHENTIK_REDIS__HOST
              value: authentik-redis
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-db
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-service
  namespace: identity
spec:
  selector:
    app: authentik-server
  ports:
    - name: http
      port: 80
      targetPort: 9000
    - name: https
      port: 443
      targetPort: 9443
