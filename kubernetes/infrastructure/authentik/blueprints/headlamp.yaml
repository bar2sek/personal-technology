# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# ==============================================================================
# Headlamp SSO: OIDC client in Authentik (docs/113)
# ==============================================================================
# Delivered as the ConfigMap `authentik-blueprints` by `just headlamp-sso-apply`.
# The worker reads /blueprints/custom and re-applies this on a schedule, so edits
# made in the Authentik UI to these objects get overwritten.
#
# Membership is set from the group side on purpose. Setting `groups` on the user
# could replace that list and remove akadmin from `authentik Admins`.
version: 1
metadata:
  name: Headlamp SSO
entries:
  - model: authentik_core.group
    id: viewers
    identifiers:
      name: headlamp-viewers
    attrs:
      users:
        - !Find [authentik_core.user, [username, akadmin]]

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Headlamp
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: headlamp
      client_secret: !Env HEADLAMP_OIDC_CLIENT_SECRET
      # Both ways in. Headlamp's own callback path is /oidc-callback.
      redirect_uris:
        - matching_mode: strict
          url: https://headlamp.bar2sek.com/oidc-callback
        - matching_mode: strict
          url: https://headlamp.tail6e33.ts.net/oidc-callback
      # kube-apiserver only accepts asymmetric signatures, so this must be set.
      # Without a signing key Authentik falls back to HS256.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      # The ID token expires with the access token. offline_access lets Headlamp
      # refresh it for 30 days instead of signing you out every hour.
      access_token_validity: hours=1
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    id: app
    identifiers:
      slug: headlamp
    attrs:
      name: Headlamp
      provider: !KeyOf provider
      meta_launch_url: https://headlamp.bar2sek.com
      meta_description: Read-only Kubernetes web UI

  # Only group members can sign in. Kubernetes RBAC is still what limits access.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf viewers
      enabled: true
