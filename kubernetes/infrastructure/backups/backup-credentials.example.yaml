# Template only. Do not fill this in and apply it: `kubectl apply` would keep a
# second copy of the secret in the last-applied-configuration annotation.
# Mint the key straight into the cluster instead; see README.md
# "Deploy the uploader credential".
apiVersion: v1
kind: Secret
metadata:
  name: s3-backup-credentials
  namespace: backups
type: Opaque
stringData:
  # Write-only key for IAM user svc-aws-backup-uploader-prod-001 (bootstrap/aws/backups.tf)
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_BACKUP_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_BACKUP_SECRET_ACCESS_KEY"
  AWS_DEFAULT_REGION: "us-east-2"
  S3_BUCKET: "s3-aws-backups-prod-use2-001"
