apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup-sa
  namespace: backups
---
# ==============================================================================
# RBAC: Scoped Secret Reader for Authentik Database Credentials
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-db-backup-reader
  namespace: identity
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-db-backup-reader-binding
  namespace: identity
subjects:
  - kind: ServiceAccount
    name: postgres-backup-sa
    namespace: backups
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-db-backup-reader
# Script logic lives in configmap-backup-scripts.yaml (shared by both CronJobs below).
---
# Offsite: PostgreSQL dumps to S3, daily 03:30 UTC. Does not mount the NAS.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-databases
  namespace: backups
spec:
  schedule: "30 3 * * *"
  # Declared explicitly: `kubectl apply` would otherwise preserve a suspend set
  # imperatively (e.g. during an incident), since it is absent from last-applied.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800 # a hung NFS mount or upload must not block forever
      template:
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
              command: ["/bin/sh", "/scripts/postgres.sh"]
              env:
                - name: DEST
                  value: s3
              envFrom:
                - secretRef:
                    name: s3-backup-credentials
                # Required (not optional): a missing ConfigMap blocks the pod from starting.
                - configMapRef:
                    name: backup-encryption
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
---
# Local: PostgreSQL dumps to the garage Synology, daily 03:40 UTC. No AWS credential.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-databases-nas
  namespace: backups
spec:
  schedule: "40 3 * * *"
  # Declared explicitly: `kubectl apply` would otherwise preserve a suspend set
  # imperatively (e.g. during an incident), since it is absent from last-applied.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800 # a hung NFS mount or upload must not block forever
      template:
        spec:
          serviceAccountName: postgres-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
              command: ["/bin/sh", "/scripts/postgres.sh"]
              env:
                - name: DEST
                  value: nas
              envFrom:
                # Required (not optional): a missing ConfigMap blocks the pod from starting.
                - configMapRef:
                    name: backup-encryption
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: synology-dr
                  mountPath: /mnt/synology-dr
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: synology-dr
              persistentVolumeClaim:
                claimName: pvc-synology-nfs-backups
