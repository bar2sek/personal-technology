apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-backup-sa
  namespace: backups
---
# ==============================================================================
# RBAC: Read-only access to exactly the kinds this job dumps.
#
# Secrets are deliberately excluded. Their real values live in the gitignored
# counterparts of each *.example template, so restoring them is a re-apply from
# those files, not from this archive. Excluding them means a compromised backup
# pod cannot read any credential in the cluster.
#
# Reading ClusterRoles/ClusterRoleBindings is not an escalation path: escalation
# requires create/update/bind, and this role only has get/list.
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-backup-cluster-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumes", "persistentvolumeclaims", "services", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-backup-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-backup-cluster-role
subjects:
  - kind: ServiceAccount
    name: k8s-backup-sa
    namespace: backups
# Script logic lives in configmap-backup-scripts.yaml (shared by both CronJobs below).
---
# Offsite: cluster state to S3, daily 03:00 UTC. Does not mount the NAS.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cluster-state
  namespace: backups
spec:
  schedule: "0 3 * * *"
  # Declared explicitly: `kubectl apply` would otherwise preserve a suspend set
  # imperatively (e.g. during an incident), since it is absent from last-applied.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800 # a hung NFS mount or upload must not block forever
      template:
        spec:
          serviceAccountName: k8s-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: cluster-backup
              image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
              command: ["/bin/sh", "/scripts/cluster-state.sh"]
              env:
                - name: DEST
                  value: s3
              envFrom:
                - secretRef:
                    name: s3-backup-credentials
                # Required (not optional): a missing ConfigMap blocks the pod from starting.
                - configMapRef:
                    name: backup-encryption
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
---
# Local: cluster state to the garage Synology, daily 03:10 UTC. No AWS credential.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cluster-state-nas
  namespace: backups
spec:
  schedule: "10 3 * * *"
  # Declared explicitly: `kubectl apply` would otherwise preserve a suspend set
  # imperatively (e.g. during an incident), since it is absent from last-applied.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800 # a hung NFS mount or upload must not block forever
      template:
        spec:
          serviceAccountName: k8s-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: cluster-backup
              image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
              command: ["/bin/sh", "/scripts/cluster-state.sh"]
              env:
                - name: DEST
                  value: nas
              envFrom:
                # Required (not optional): a missing ConfigMap blocks the pod from starting.
                - configMapRef:
                    name: backup-encryption
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: synology-dr
                  mountPath: /mnt/synology-dr
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: synology-dr
              persistentVolumeClaim:
                claimName: pvc-synology-nfs-backups
