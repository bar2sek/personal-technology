apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-backup-sa
  namespace: backups
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-backup-cluster-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-backup-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-backup-cluster-role
subjects:
  - kind: ServiceAccount
    name: k8s-backup-sa
    namespace: backups
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cluster-state
  namespace: backups
spec:
  schedule: "0 3 * * *" # Daily at 03:00 UTC (10:00 PM CDT)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: k8s-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: cluster-backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/tmp/k8s-backup-${TIMESTAMP}"
                  ARCHIVE_FILE="/tmp/k8s-cluster-state-${TIMESTAMP}.tar.gz"

                  if [ "${AWS_ACCESS_KEY_ID}" = "REPLACE_WITH_AWS_BACKUP_ACCESS_KEY_ID" ] || [ -z "${AWS_ACCESS_KEY_ID}" ]; then
                    echo "ERROR: AWS credentials not configured in secret 's3-backup-credentials'."
                    exit 1
                  fi

                  echo "Installing backup dependencies (aws-cli, curl, tar, gzip, jq, openssl)..."
                  apk add --no-cache aws-cli curl tar gzip jq openssl

                  KUBECTL_VERSION="v1.36.4"
                  KUBECTL_SHA256="8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a"

                  echo "Installing verified kubectl ${KUBECTL_VERSION} CLI..."
                  curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
                  echo "${KUBECTL_SHA256}  /usr/local/bin/kubectl" | sha256sum -c -
                  chmod +x /usr/local/bin/kubectl

                  mkdir -p "${BACKUP_DIR}/cluster-scoped" "${BACKUP_DIR}/namespaces"

                  echo "Dumping Custom Resource Definitions (CRDs)..."
                  kubectl get crd -o json | jq 'del(.items[].metadata.resourceVersion, .items[].metadata.uid, .items[].metadata.creationTimestamp, .items[].metadata.generation, .items[].metadata.managedFields, .items[].status)' > "${BACKUP_DIR}/cluster-scoped/crds.json" || true

                  echo "Dumping Cluster-Scoped Resources (StorageClasses, PVs, ClusterRoles)..."
                  kubectl get storageclass,persistentvolume,clusterroles,clusterrolebindings,ingressclasses -o json | jq 'del(.items[].metadata.resourceVersion, .items[].metadata.uid, .items[].metadata.creationTimestamp, .items[].metadata.generation, .items[].metadata.managedFields, .items[].status)' > "${BACKUP_DIR}/cluster-scoped/cluster-resources.json" || true

                  echo "Dumping Declarative Namespaced Resources across all namespaces..."
                  TARGET_RESOURCES="deployments,statefulsets,daemonsets,cronjobs,services,configmaps,secrets,persistentvolumeclaims,ingresses,networkpolicies"
                  for ns in $(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}'); do
                    mkdir -p "${BACKUP_DIR}/namespaces/${ns}"
                    echo " -> Backing up namespace: ${ns}..."
                    kubectl get ${TARGET_RESOURCES} -n "${ns}" -o json 2>/dev/null | jq 'del(.items[].metadata.resourceVersion, .items[].metadata.uid, .items[].metadata.creationTimestamp, .items[].metadata.generation, .items[].metadata.managedFields, .items[].status, .items[].spec.clusterIP, .items[].spec.clusterIPs)' > "${BACKUP_DIR}/namespaces/${ns}/declarative-resources.json" || true
                  done

                  echo "Compressing declarative cluster state archive..."
                  tar -czf "${ARCHIVE_FILE}" -C "${BACKUP_DIR}" .

                  FINAL_PAYLOAD="${ARCHIVE_FILE}"
                  S3_DEST_FILE="k8s-cluster-state-${TIMESTAMP}.tar.gz"

                  if [ -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ] && [ "${BACKUP_ENCRYPTION_PASSPHRASE}" != "REPLACE_WITH_ENCRYPTION_PASSPHRASE" ]; then
                    echo "Encrypting backup archive with client-side AES-256-CBC..."
                    openssl enc -aes-256-cbc -salt -pbkdf2 -in "${ARCHIVE_FILE}" -out "${ARCHIVE_FILE}.enc" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
                    FINAL_PAYLOAD="${ARCHIVE_FILE}.enc"
                    S3_DEST_FILE="k8s-cluster-state-${TIMESTAMP}.tar.gz.enc"
                  fi

                  echo "Uploading cluster state archive to AWS S3..."
                  aws s3 cp "${FINAL_PAYLOAD}" "s3://${S3_BUCKET}/cluster-state/${S3_DEST_FILE}" --storage-class STANDARD

                  if [ -d "/mnt/synology-dr" ]; then
                    echo "Mirroring cluster state archive to local Synology Tier-3 storage..."
                    mkdir -p "/mnt/synology-dr/cluster-state"
                    cp "${FINAL_PAYLOAD}" "/mnt/synology-dr/cluster-state/${S3_DEST_FILE}"
                    find /mnt/synology-dr/cluster-state -name "k8s-cluster-state-*" -type f -mtime +30 -delete 2>/dev/null || true
                    echo "Tier-3 local mirror successfully updated."
                  fi

                  rm -rf "${BACKUP_DIR}" "${ARCHIVE_FILE}" "${ARCHIVE_FILE}.enc" 2>/dev/null || true
                  echo "Kubernetes declarative cluster backup successfully completed and uploaded to S3 + Synology."
              volumeMounts:
                - name: synology-dr
                  mountPath: /mnt/synology-dr
              envFrom:
                - secretRef:
                    name: s3-backup-credentials
          volumes:
            - name: synology-dr
              persistentVolumeClaim:
                claimName: pvc-synology-nfs-backups
