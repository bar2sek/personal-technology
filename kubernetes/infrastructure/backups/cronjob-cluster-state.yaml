apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-backup-sa
  namespace: backups
---
# ==============================================================================
# RBAC: Read-only access to exactly the kinds this job dumps.
#
# Secrets are deliberately excluded. Their real values live in the gitignored
# counterparts of each *.example template, so restoring them is a re-apply from
# those files, not from this archive. Excluding them means a compromised backup
# pod cannot read any credential in the cluster.
#
# Reading ClusterRoles/ClusterRoleBindings is not an escalation path: escalation
# requires create/update/bind, and this role only has get/list.
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-backup-cluster-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumes", "persistentvolumeclaims", "services", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-backup-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-backup-cluster-role
subjects:
  - kind: ServiceAccount
    name: k8s-backup-sa
    namespace: backups
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-cluster-state
  namespace: backups
spec:
  schedule: "0 3 * * *" # Daily at 03:00 UTC (10:00 PM CDT)
  # Declared explicitly: `kubectl apply` would otherwise preserve a suspend set
  # imperatively (e.g. during an incident), since it is absent from last-applied.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: k8s-backup-sa
          restartPolicy: OnFailure
          containers:
            - name: cluster-backup
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/tmp/k8s-backup-${TIMESTAMP}"
                  OBJECT_NAME="k8s-cluster-state-${TIMESTAMP}.tar.gz.age"
                  ENCRYPTED_FILE="/tmp/${OBJECT_NAME}"

                  # Fail closed: without an age recipient there is no backup at all,
                  # never an unencrypted one.
                  case "${AGE_RECIPIENT:-}" in
                    age1*) ;;
                    *) echo "ERROR: AGE_RECIPIENT missing or invalid (ConfigMap 'backup-encryption'). Refusing to back up." >&2; exit 1 ;;
                  esac

                  if [ "${AWS_ACCESS_KEY_ID:-}" = "REPLACE_WITH_AWS_BACKUP_ACCESS_KEY_ID" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
                    echo "ERROR: AWS credentials not configured in secret 's3-backup-credentials'." >&2
                    exit 1
                  fi

                  echo "Installing backup dependencies (aws-cli, curl, tar, gzip, jq, age)..."
                  apk add --no-cache aws-cli curl tar gzip jq age

                  # age parses the recipient strictly; a typo fails here, before any data is read.
                  echo probe | age -r "${AGE_RECIPIENT}" > /dev/null

                  KUBECTL_VERSION="v1.36.4"
                  KUBECTL_SHA256="8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a"

                  echo "Installing verified kubectl ${KUBECTL_VERSION} CLI..."
                  curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
                  echo "${KUBECTL_SHA256}  /usr/local/bin/kubectl" | sha256sum -c -
                  chmod +x /usr/local/bin/kubectl

                  mkdir -p "${BACKUP_DIR}/cluster-scoped" "${BACKUP_DIR}/namespaces"
                  STRIP='del(.items[].metadata.resourceVersion, .items[].metadata.uid, .items[].metadata.creationTimestamp, .items[].metadata.generation, .items[].metadata.managedFields, .items[].status)'

                  echo "Dumping Custom Resource Definitions (CRDs)..."
                  kubectl get crd -o json | jq "${STRIP}" > "${BACKUP_DIR}/cluster-scoped/crds.json"

                  echo "Dumping Cluster-Scoped Resources (StorageClasses, PVs, ClusterRoles)..."
                  kubectl get storageclass,persistentvolume,clusterroles,clusterrolebindings,ingressclasses -o json | jq "${STRIP}" > "${BACKUP_DIR}/cluster-scoped/cluster-resources.json"

                  # Secrets are intentionally not dumped (see the ClusterRole above).
                  echo "Dumping Declarative Namespaced Resources across all namespaces..."
                  TARGET_RESOURCES="deployments,statefulsets,daemonsets,cronjobs,services,configmaps,persistentvolumeclaims,ingresses,networkpolicies"
                  for ns in $(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}'); do
                    mkdir -p "${BACKUP_DIR}/namespaces/${ns}"
                    echo " -> Backing up namespace: ${ns}..."
                    kubectl get ${TARGET_RESOURCES} -n "${ns}" -o json | jq "${STRIP} | del(.items[].spec.clusterIP, .items[].spec.clusterIPs)" > "${BACKUP_DIR}/namespaces/${ns}/declarative-resources.json"
                  done

                  echo "Compressing and encrypting cluster state archive (age)..."
                  tar -czf - -C "${BACKUP_DIR}" . | age -r "${AGE_RECIPIENT}" -o "${ENCRYPTED_FILE}"
                  rm -rf "${BACKUP_DIR}"

                  echo "Uploading encrypted archive to s3://${S3_BUCKET}/cluster-state/${OBJECT_NAME}..."
                  aws s3 cp "${ENCRYPTED_FILE}" "s3://${S3_BUCKET}/cluster-state/${OBJECT_NAME}" --storage-class STANDARD --checksum-algorithm CRC32

                  rm -f "${ENCRYPTED_FILE}"
                  echo "Encrypted cluster state backup completed: ${OBJECT_NAME}"
              envFrom:
                - secretRef:
                    name: s3-backup-credentials
                # Required (not optional): a missing ConfigMap blocks the pod from starting.
                - configMapRef:
                    name: backup-encryption
