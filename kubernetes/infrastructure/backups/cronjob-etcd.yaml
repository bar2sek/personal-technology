apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-etcd-snapshot
  namespace: backups
spec:
  schedule: "0 3 * * *" # Daily at 03:00 UTC (10:00 PM CDT)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: etcd-backup
              image: amazon/aws-cli:2.15.30
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/tmp/etcd-${TIMESTAMP}.snapshot"
                  export HOME=/tmp

                  if [ "${AWS_ACCESS_KEY_ID}" = "REPLACE_WITH_AWS_BACKUP_ACCESS_KEY_ID" ] || [ -z "${AWS_ACCESS_KEY_ID}" ]; then
                    echo "ERROR: AWS credentials not configured in secret 's3-backup-credentials'."
                    echo "Please edit kubernetes/infrastructure/backups/backup-credentials.yaml with active credentials and re-apply."
                    exit 1
                  fi

                  if [ ! -f /etc/talos/talosconfig ]; then
                    echo "ERROR: Talos admin configuration not found at /etc/talos/talosconfig."
                    echo "Please create the secret 'talos-admin-config' in namespace 'backups':"
                    echo "  kubectl create secret generic talos-admin-config --from-file=talosconfig=<path-to-talosconfig> -n backups"
                    exit 1
                  fi

                  echo "Copying talosconfig to writable runtime environment..."
                  cp /etc/talos/talosconfig /tmp/talosconfig
                  chmod 600 /tmp/talosconfig

                  echo "Downloading talosctl CLI..."
                  curl -fsSL https://github.com/siderolabs/talos/releases/download/v1.13.10/talosctl-linux-amd64 -o /usr/local/bin/talosctl
                  chmod +x /usr/local/bin/talosctl

                  echo "Generating Talos etcd snapshot via HA VIP (10.10.20.10)..."
                  talosctl --talosconfig /tmp/talosconfig -n 10.10.20.10 etcd snapshot "${BACKUP_FILE}"

                  echo "Compressing snapshot..."
                  gzip "${BACKUP_FILE}"

                  echo "Uploading snapshot to S3: s3://${S3_BUCKET}/etcd/etcd-${TIMESTAMP}.snapshot.gz..."
                  aws s3 cp "${BACKUP_FILE}.gz" "s3://${S3_BUCKET}/etcd/etcd-${TIMESTAMP}.snapshot.gz" --storage-class STANDARD

                  echo "Etcd snapshot successfully completed and offloaded to S3."
              envFrom:
                - secretRef:
                    name: s3-backup-credentials
              volumeMounts:
                - name: talosconfig
                  mountPath: /etc/talos
                  readOnly: true
          volumes:
            - name: talosconfig
              secret:
                secretName: talos-admin-config
                optional: true
