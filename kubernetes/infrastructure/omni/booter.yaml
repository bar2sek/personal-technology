apiVersion: apps/v1
kind: Deployment
metadata:
  name: booter
  namespace: omni
  labels:
    app.kubernetes.io/name: booter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: booter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booter
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: booter
          image: ghcr.io/siderolabs/booter:v0.3.0
          args:
            - --talos-version=v1.13.10
            - --schematic-id=5cd745a060945934ac9f118483db0d1b2e405b934c07716d583060cc30fa899f
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_BIND_SERVICE"]
