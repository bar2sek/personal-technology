apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: omni
  labels:
    app.kubernetes.io/name: dex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/cfg/config.yaml"]
          ports:
            - name: https
              containerPort: 5556
              hostPort: 5556
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5556
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/dex/cfg
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: dex-config
        - name: tls
          secret:
            secretName: dex-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: omni
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: https
      port: 5556
      targetPort: 5556
