# GitHub App credentials for Actions Runner Controller (ARC).
#
# PREFERRED: don't fill in this file. The vault syncs to Google Drive, and this
# would put the App private key there. Instead create the Secret straight from
# the downloaded .pem, then delete the .pem:
#
#   just gha-runners-secret <app-id> <installation-id> ~/Downloads/<app>.private-key.pem
#
# This template documents the Secret's shape (keys the gha-runner-scale-set
# chart expects).
#
# Why a GitHub App instead of a personal access token (PAT):
#   * Installed on exactly one repository (the PRIVATE homelab-ops repo)
#   * ARC exchanges the key for installation tokens that expire after 1 hour
#   * Not tied to a personal account; revocable without touching your login
apiVersion: v1
kind: Secret
metadata:
  name: github-app-secret
  namespace: arc-runners
type: Opaque
stringData:
  github_app_id: "REPLACE_WITH_APP_ID"
  github_app_installation_id: "REPLACE_WITH_INSTALLATION_ID"
  github_app_private_key: |
    REPLACE_WITH_APP_PRIVATE_KEY_PEM
