apiVersion: v1
kind: Namespace
metadata:
  name: actions-runner-system
---
apiVersion: v1
kind: Secret
metadata:
  name: github-token-secret
  namespace: actions-runner-system
type: Opaque
stringData:
  github_token: "REPLACE_WITH_GITHUB_PAT" # Injected via secret manager or SealedSecrets
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: talos-homelab-runner
  namespace: actions-runner-system
spec:
  githubConfigUrl: "https://github.com/bar2sek/talos-aws-homelab"
  githubConfigSecret: github-token-secret
  minReplicas: 0
  maxReplicas: 5
  template:
    spec:
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/home/runner/run.sh"]
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
