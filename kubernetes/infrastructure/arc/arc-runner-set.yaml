apiVersion: v1
kind: Namespace
metadata:
  name: actions-runner-system
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: talos-homelab-runner
  namespace: actions-runner-system
spec:
  githubConfigUrl: "https://github.com/bar2sek/personal-technology"
  githubConfigSecret: github-token-secret
  minReplicas: 0
  maxReplicas: 5
  template:
    spec:
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.322.0
          command: ["/home/runner/run.sh"]
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
