# Helm values for rook-ceph operator on Talos Linux
crds:
  enabled: true

enableDiscoveryDaemon: true
discoveryDaemonInterval: 60m

# Resources for the operator pod
resources:
  limits:
    # Averages ~25m but reconciles in short bursts; 500m tripped CPUThrottlingHigh
    # (CFS throttles any 100ms window over the limit). 1000m matches the Ceph cluster spec.
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 128Mi

csi:
  enableRbdDriver: true
  enableCephfsDriver: true

monitoring:
  enabled: true

