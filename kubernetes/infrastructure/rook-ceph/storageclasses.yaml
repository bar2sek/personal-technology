# Pins Ceph's built-in .mgr pool to the ssd class. Left on the default
# replicated_rule it spans every device class, which overlaps the class-specific
# rules below and makes the PG autoscaler skip ALL pools (each stuck at 1 PG).
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: builtin-mgr
  namespace: rook-ceph
spec:
  name: .mgr
  failureDomain: host
  replicated:
    size: 3
    requireSafeReplicaSize: true
  deviceClass: ssd
  parameters:
    compression_mode: none
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: builtin-ssd-pool
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 3
  deviceClass: ssd
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: builtin-ssd-pool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: nvme-high-iops-pool
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 3
  deviceClass: nvme
  # bulk: autoscaler allocates the full PG share up front instead of growing
  # from 1 as data arrives, so I/O spreads across every NVMe OSD from day one.
  parameters:
    bulk: "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block-nvme
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: nvme-high-iops-pool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
---
# Tier 3 (bulk HDD): erasure coded 2+1 across the three HDD hosts (pc-node-04,
# pc-node-05, sm-node-03), Wave 5 in docs/110, 2026-10-19. Replaces the old
# hdd-bulk-pool (replicated size 2, failureDomain osd: both copies could land on
# pc-node-04). Each object = 2 data + 1 parity chunk on three different hosts:
# 1.5x overhead, survives one host down. Usable ~ 2 x smallest host (~12.7 TiB).
# Scratch/overflow tier only (docs/104 storage policy): never the only copy.
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: hdd-ec-data-pool
  namespace: rook-ceph
spec:
  failureDomain: host
  deviceClass: hdd
  erasureCoded:
    dataChunks: 2
    codingChunks: 1
  parameters:
    bulk: "true"
    # Default min_size for k=2,m=1 is 3: one host down would block writes.
    # 2 keeps the pool writable then, with no redundancy until the host
    # returns. Accepted for a scratch tier.
    min_size: "2"
---
# RBD keeps image headers and omap metadata in a replicated pool; only the
# data objects go to the EC pool. Tiny, so put it on SSD for latency.
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: hdd-ec-meta-pool
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 3
  deviceClass: ssd
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-hdd-ec
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: hdd-ec-meta-pool
  dataPool: hdd-ec-data-pool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: ceph-filesystem
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 3
    deviceClass: nvme
  dataPools:
    - failureDomain: host
      replicated:
        size: 3
      deviceClass: ssd
      name: data0
  metadataServer:
    activeCount: 1
    activeStandby: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-filesystem
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: ceph-filesystem
  pool: ceph-filesystem-data0
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Retain
allowVolumeExpansion: true
