apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.1
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  # Ceph options Rook writes to the mon config database (`ceph config dump`).
  # pc-node-05 has 32 GB shared with the gaming VM, so its two IronWolf OSDs
  # get 2 GiB instead of the 4 GiB default (Wave 3, docs/110).
  cephConfig:
    osd.13:
      osd_memory_target: "2147483648"
    osd.14:
      osd_memory_target: "2147483648"
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true
  dashboard:
    enabled: true
    ssl: true
  monitoring:
    enabled: true
  network:
    provider: host
    ipFamily: IPv4
    addressRanges:
      public:
        - 10.10.20.0/24
      cluster:
        - 10.10.40.0/24
  crashCollector:
    disable: false
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
  placement:
    all:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    # OSDs (and their prepare jobs, which inherit this) must tolerate the soft
    # taint homelab.bar2sek.com/small-var on the sm nodes (Omni patch
    # controlplane-prefer-no-schedule). Rook's node check treats ANY untolerated
    # taint, even PreferNoSchedule, as "placement settings do not match" and
    # silently skips the node: found 2026-10-19 when sm-node-03's new IronWolfs
    # got no prepare job (Wave 4, docs/110). Only OSDs: mgr/mds keep preferring
    # the PCs. Rook merges these with placement.all's tolerations.
    osd:
      tolerations:
        - key: homelab.bar2sek.com/small-var
          operator: Exists
          effect: PreferNoSchedule
    # Monitors keep their store under dataDirHostPath (/var/lib/rook), on each
    # node's /var. The Supermicro nodes have only 12.5 GiB of /var and keep
    # tripping MON_DISK_LOW (<30% free), so prefer the PCs (72 GiB and 929 GiB).
    # Preferred, not required: if a preferred node is lost for good, Rook can
    # still fail a monitor over to any other node instead of staying at two.
    # Third choice is sm-node-01: its SuperDOM is the least loaded. A monitor
    # shares the SuperDOM with etcd, and both fsync constantly; on sm-node-02
    # that pushed etcd write p99 to 2.6 s (KubeAPIErrorBudgetBurn, 2026-10-18).
    mon:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["pc-node-04", "pc-node-05"]
          - weight: 50
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["sm-node-01"]
  resources:
    mgr:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
    mon:
      limits:
        cpu: "2000m"
        memory: "2Gi"
      requests:
        cpu: "1000m"
        memory: "1Gi"
    osd:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "2Gi"
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      # Tier 1 (NVMe) & Tier 2 (SATA SSD) on Supermicro Node 01
      # (Boot drive /dev/sda SuperDOM is strictly excluded)
      - name: sm-node-01
        devices:
          - name: "/dev/disk/by-id/nvme-Sabrent_Rocket_Q_BC7107061E7C02090817"
            config:
              deviceType: nvme
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2137E5D2DE18"
            config:
              deviceType: ssd
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2351E88AE052"
            config:
              deviceType: ssd

      # Tier 1 (NVMe) & Tier 2 (SATA SSD) on Supermicro Node 02
      # (Boot drive /dev/sda SuperDOM is strictly excluded)
      - name: sm-node-02
        devices:
          - name: "/dev/disk/by-id/nvme-Sabrent_Rocket_Q_F2C10719080B00006324"
            config:
              deviceType: nvme
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2153E5F9EC69"
            config:
              deviceType: ssd
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2351E88AE0BD"
            config:
              deviceType: ssd

      # Tier 2 (SATA SSD) on Supermicro Node 03
      # (Boot drives /dev/sde & /dev/sdf SuperDOMs are strictly excluded)
      # Storage reshuffle (docs/110, docs/111): MX500s 2137E5D2DE1D, 2137E5D2DE26
      # and 2253E698684D removed 2026-10-18; they move to pc-node-04 (Wave 2).
      # The 4 TB IronWolfs from pc-node-04 are added here in Wave 4.
      - name: sm-node-03
        devices:
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2253E6986843"
            config:
              deviceType: ssd
          # Two IronWolf 4 TB from pc-node-04 (Wave 4, docs/110, 2026-10-19):
          # sm-node-03 becomes the third HDD host for the EC 2+1 pool (Wave 5).
          # /var now lives on the 250 GB MX500 (not a Ceph device).
          - name: "/dev/disk/by-id/ata-ST4000VN008-2DR166_ZGY91H5S"
            config:
              deviceType: hdd
          - name: "/dev/disk/by-id/ata-ST4000VN008-2DR166_ZDH9HRSJ"
            config:
              deviceType: hdd

      # Tier 1 (NVMe) & Tier 3 (Bulk HDD Array) on Storage PC Node 04
      # (Boot drive Intel 320 SSD and the two spare Intel 335 SSDs are excluded
      #  by omission; /dev/sdX letters changed in Wave 2, so match by-id only)
      # Storage reshuffle (docs/110, docs/111): the four IronWolf ST4000VN008
      # (to sm-node-03 and pc-node-05) and the failing WD15EADS (retired)
      # removed 2026-10-18. Three MX500 2 TB from sm-node-03 added in Wave 2,
      # making pc-node-04 the fourth SSD host.
      - name: pc-node-04
        devices:
          - name: "/dev/disk/by-id/nvme-CT1000P3PSSD8_24024637AFE2"
            config:
              deviceType: nvme
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2137E5D2DE1D"
            config:
              deviceType: ssd
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2137E5D2DE26"
            config:
              deviceType: ssd
          - name: "/dev/disk/by-id/ata-CT2000MX500SSD1_2253E698684D"
            config:
              deviceType: ssd
          - name: "/dev/disk/by-id/ata-ST2000NM0033-9ZM175_Z1X6R0DV"
            config:
              deviceType: hdd
          - name: "/dev/disk/by-id/ata-ST31000528AS_5VP53T85"
            config:
              deviceType: hdd
          - name: "/dev/disk/by-id/ata-ST31000524AS_5VP8SHWD"
            config:
              deviceType: hdd
          - name: "/dev/disk/by-id/ata-ST3000DM007-1WY10G_ZFQ02CAN"
            config:
              deviceType: hdd

      # Tier 1 (NVMe) on GPU Worker Node 05
      # (Boot drive Kingston SQ500S3 SATA SSD and the Sabrent Rocket NVMe, which
      #  is the gaming VM's local disk since Wave 3b, are excluded by omission)
      # Storage reshuffle Wave 3 (2026-10-18): re-cased with two IronWolf 4 TB
      # from pc-node-04, making it the third HDD host for the EC 2+1 pool.
      - name: pc-node-05
        devices:
          - name: "/dev/disk/by-id/nvme-CT1000P3SSD8_2248E68D1159"
            config:
              deviceType: nvme
          - name: "/dev/disk/by-id/ata-ST4000VN008-2DR166_ZGY9165H"
            config:
              deviceType: hdd
          - name: "/dev/disk/by-id/ata-ST4000VN008-2DR166_ZGY91889"
            config:
              deviceType: hdd
