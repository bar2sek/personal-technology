apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.1
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true
  dashboard:
    enabled: true
    ssl: true
  monitoring:
    enabled: true
  network:
    provider: host
    ipFamily: IPv4
  crashCollector:
    disable: false
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
  placement:
    all:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  resources:
    mgr:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
    mon:
      limits:
        cpu: "2000m"
        memory: "2Gi"
      requests:
        cpu: "1000m"
        memory: "1Gi"
    osd:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "2Gi"
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      # Tier 1 (NVMe) & Tier 2 (SATA SSD) on Supermicro Node 01
      # (Boot drive /dev/sda SuperDOM is strictly excluded)
      - name: sm-node-01
        devices:
          - name: "nvme0n1" # Tier 1 NVMe (2TB)
            config:
              deviceType: nvme
          - name: "sdb"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdc"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd

      # Tier 1 (NVMe) & Tier 2 (SATA SSD) on Supermicro Node 02
      # (Boot drive /dev/sda SuperDOM is strictly excluded)
      - name: sm-node-02
        devices:
          - name: "nvme0n1" # Tier 1 NVMe (2TB)
            config:
              deviceType: nvme
          - name: "sdb"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdc"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd

      # Tier 2 (SATA SSD) on Supermicro Node 03
      # (Boot drives /dev/sde & /dev/sdf SuperDOMs are strictly excluded)
      - name: sm-node-03
        devices:
          - name: "sda"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdb"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdc"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdd"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd

      # Tier 1 (NVMe) & Tier 3 (Bulk HDD Array) on Storage PC Node 04
      # (Boot drive /dev/sdc Intel SSD is strictly excluded;
      #  Scratch drives /dev/sdf, /dev/sdg, /dev/sdm are strictly excluded)
      - name: pc-node-04
        devices:
          - name: "nvme0n1" # Tier 1 NVMe (1TB Crucial P3)
            config:
              deviceType: nvme
          - name: "sda"     # Tier 3 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sdb"     # Tier 3 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sdd"     # Tier 3 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sde"     # Tier 3 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sdh"     # Tier 3 2TB Seagate Constellation Enterprise HDD
            config:
              deviceType: hdd
          - name: "sdi"     # Tier 3 1TB Seagate BarraCuda HDD
            config:
              deviceType: hdd
          - name: "sdj"     # Tier 3 1TB Seagate BarraCuda HDD
            config:
              deviceType: hdd
          - name: "sdk"     # Tier 3 1.5TB WD Green HDD
            config:
              deviceType: hdd
          - name: "sdl"     # Tier 3 3TB Seagate BarraCuda HDD
            config:
              deviceType: hdd

      # Tier 1 (NVMe) on GPU Worker Node 05
      # (Boot drive /dev/nvme1n1 Sabrent Rocket is strictly excluded)
      - name: pc-node-05
        devices:
          - name: "nvme0n1" # Tier 1 NVMe (1TB Crucial P3)
            config:
              deviceType: nvme
