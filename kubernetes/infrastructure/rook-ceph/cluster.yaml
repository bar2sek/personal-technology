apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.1
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true
  dashboard:
    enabled: true
    ssl: true
  network:
    provider: host
    ipFamily: IPv4
  crashCollector:
    disable: false
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
  placement:
    all:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  resources:
    mgr:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
    mon:
      limits:
        cpu: "2000m"
        memory: "2Gi"
      requests:
        cpu: "1000m"
        memory: "1Gi"
    osd:
      limits:
        cpu: "2000m"
        memory: "4Gi"
      requests:
        cpu: "500m"
        memory: "2Gi"
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      # Tier 1 & Tier 2 OSDs on Supermicro Node 01
      - name: sm-node-01
        devices:
          - name: "nvme0n1" # Tier 1 NVMe (2TB)
            config:
              deviceType: nvme
          - name: "sda"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdb"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
      # Tier 1 & Tier 2 OSDs on Supermicro Node 02
      - name: sm-node-02
        devices:
          - name: "nvme0n1" # Tier 1 NVMe (2TB)
            config:
              deviceType: nvme
          - name: "sda"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdb"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
      # Tier 2 OSDs on Supermicro Node 03
      - name: sm-node-03
        devices:
          - name: "sda"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdb"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdc"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
          - name: "sdd"     # Tier 2 SATA SSD (2TB)
            config:
              deviceType: ssd
      # Tier 3 OSDs on Storage PC Node 04 (Bulk HDD Array)
      - name: pc-node-04
        devices:
          - name: "sdb"     # 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sdc"     # 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sdd"     # 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sde"     # 4TB Seagate IronWolf NAS HDD
            config:
              deviceType: hdd
          - name: "sdf"     # 2TB Seagate Constellation ES.3 Enterprise HDD
            config:
              deviceType: hdd
          - name: "sdg"     # 2TB Seagate Constellation ES.3 Enterprise HDD
            config:
              deviceType: hdd
          - name: "sdh"     # 3TB Seagate BarraCuda HDD
            config:
              deviceType: hdd
          - name: "sdi"     # 1.5TB WD Green HDD
            config:
              deviceType: hdd
          - name: "sdj"     # 1TB Seagate Barracuda HDD
            config:
              deviceType: hdd
          - name: "sdk"     # 1TB Seagate Barracuda HDD
            config:
              deviceType: hdd
          - name: "sdl"     # 500GB HGST HDD
            config:
              deviceType: hdd
      # Tier 1 OSD on GPU Worker Node 05
      - name: pc-node-05
        devices:
          - name: "nvme0n1p2" # 998GB Unpartitioned NVMe Data Partition
            config:
              deviceType: nvme
