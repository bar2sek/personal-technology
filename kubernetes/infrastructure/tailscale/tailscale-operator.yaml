apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
# ==============================================================================
# Declarative Tailscale Subnet Router
# ==============================================================================
# Routes internal cluster control plane (VLAN 20) and application workloads
# (VLAN 30) to the Tailnet.
#
# IMPORTANT: VLAN 10 (10.10.10.0/24 MGMT-IPMI) is explicitly EXCLUDED to prevent
# exposing out-of-band motherboard BMC interfaces over Tailscale.
# State is persisted in Kubernetes Secret 'tailscale-subnet-router-state'.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale
  labels:
    app: tailscale-subnet-router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.74.2
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: authkey
            - name: TS_ROUTES
              value: "10.10.20.0/24,10.10.30.0/24"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_HOSTNAME
              value: "talos-k8s-subnet-router"
            - name: TS_KUBE_SECRET
              value: "tailscale-subnet-router-state"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
