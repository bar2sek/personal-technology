apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
type: Opaque
stringData:
  client_id: "REPLACE_WITH_TAILSCALE_CLIENT_ID"
  client_secret: "REPLACE_WITH_TAILSCALE_CLIENT_SECRET"
---
# Tailscale Subnet Router Pod to route internal homelab subnets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: tailscale
  labels:
    app: tailscale-subnet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      containers:
        - name: tailscale
          image: tailscale/tailscale:latest
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: operator-oauth
                  key: client_secret
                  optional: true
            - name: TS_ROUTES
              value: "10.10.0.0/16"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_HOSTNAME
              value: "talos-k8s-subnet-router"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
