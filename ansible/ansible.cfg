[defaults]
inventory = ./inventory/hosts.ini
# Verify SSH host keys against ~/.ssh/known_hosts. After a reinstall, the VM has
# new keys: confirm the fingerprint, then `ssh-keygen -R <host>` and reconnect once.
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
timeout = 60

[privilege_escalation]
become = False

[winrm]
server_cert_validation = ignore

[ssh_connection]
# Don't force a TTY (ssh -tt). Bazzite's shell startup sends terminal queries
# (OSC 10/11, cursor position) and waits for replies when it has a TTY, so the
# sudo prompt never appears and become times out. sudo -S reads the password
# from stdin and does not need a TTY.
usetty = False
