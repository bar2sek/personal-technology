[gaming_vms]
bazzite-gaming-vm ansible_host=10.10.20.52

[gaming_vms:vars]
ansible_user=bazzite
ansible_connection=ssh
# Stable symlink: OS image updates change the Python minor version, and a
# discovered path like /usr/bin/python3.13 disappears after rebooting into them.
ansible_python_interpreter=/usr/bin/python3
