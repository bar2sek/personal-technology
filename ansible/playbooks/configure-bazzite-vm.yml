# ==============================================================================
# Bazzite gaming VM: post-install configuration (run: `just bazzite-setup`)
# ==============================================================================
# Takes a fresh Bazzite-NVIDIA install to a working Moonlight/Sunshine host.
# Safe to re-run: every task is idempotent.
#
# One-time bootstrap after installing (Ansible needs SSH first):
#   1. In the VM's desktop (VNC during install mode, or the 4070's monitor):
#        sudo systemctl enable --now sshd
#   2. On the Mac, install the SSH key through the Kubernetes API (bypasses the
#      LAN, so sshd's PerSourcePenalties cannot block it):
#        cat ~/.ssh/id_ed25519.pub | virtctl ssh bazzite@vmi/bazzite-gaming-vm -n vms \
#          -c 'umask 077; mkdir -p ~/.ssh; cat >> ~/.ssh/authorized_keys'
#   3. After a reinstall the VM has new host keys: confirm the fingerprint, then
#        ssh-keygen -R 10.10.20.52 && ssh bazzite@10.10.20.52 true
#
# Manual by design (interactive or secret): Sunshine admin credentials and
# Moonlight PIN pairing (https://10.10.20.52:47990), Steam login, Battle.net login.
---
- name: Configure Bazzite Linux Gaming VM
  hosts: gaming_vms
  gather_facts: true
  vars:
    ge_proton_version: GE-Proton10-34
    sunshine_files: /var/lib/flatpak/app/dev.lizardbyte.app.Sunshine/current/active/files
    steam_library: /home/bazzite/.local/share/Steam/steamapps
    bnet_program_files: "{{ steam_library }}/compatdata/3234450451/pfx/drive_c/Program Files (x86)"
    devilutionx_data: /home/bazzite/.var/app/org.diasurgical.DevilutionX/data/diasurgical/devilution
    # Steam games to install, by store app ID (the number in the store URL).
    # Install-only: removing an entry does not uninstall the game.
    steam_apps:
      - { appid: 1151640, name: "Horizon Zero Dawn Complete Edition" }
      - { appid: 1659420, name: "UNCHARTED Legacy of Thieves Collection" }
      - { appid: 1888930, name: "The Last of Us Part I" }
  tasks:
    # The install ISO can be months old. Bazzite also auto-updates, but bring a
    # fresh install current before configuring it.
    - name: Update the OS image to the latest bazzite-nvidia:stable
      become: true
      ansible.builtin.command: rpm-ostree upgrade
      register: os_upgrade
      changed_when: "'No upgrade available' not in os_upgrade.stdout"

    # Bazzite's own updater (uupd) may already have staged a newer image, in
    # which case `rpm-ostree upgrade` reports nothing to do. Reboot whenever the
    # first deployment is not the booted one, whoever staged it.
    - name: Check for a staged deployment that is not booted yet
      ansible.builtin.command: rpm-ostree status --json
      register: ostree_status
      changed_when: false

    - name: Reboot into the updated image
      become: true
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: os_upgrade is changed or not (ostree_status.stdout | from_json).deployments[0].booted

    - name: Verify NVIDIA GPU driver and hardware acceleration
      ansible.builtin.command: nvidia-smi
      register: nvidia_smi
      changed_when: false

    - name: Display NVIDIA Driver & GPU Status
      ansible.builtin.debug:
        var: nvidia_smi.stdout_lines

    - name: Enable systemd lingering for user services
      ansible.builtin.command: loginctl enable-linger bazzite
      become: true
      args:
        creates: /var/lib/systemd/linger/bazzite

    # Older images use SDDM, Fedora 44+ images use Plasma Login. Configure both
    # so autologin survives an image update that switches display manager.
    - name: Ensure display manager config directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /etc/sddm.conf.d
        - /etc/plasmalogin.conf.d

    - name: Configure SDDM and Plasmalogin autologin for bazzite user
      become: true
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: |
          [Autologin]
          User=bazzite
          Session=plasma
          Relogin=true
        owner: root
        group: root
        mode: '0644'
      loop:
        - /etc/sddm.conf.d/autologin.conf
        - /etc/plasmalogin.conf.d/autologin.conf
      register: desktop_autologin

    - name: Remove override plasma setup autologin if present
      become: true
      ansible.builtin.file:
        path: /etc/plasmalogin.conf.d/99-plasma-setup.conf
        state: absent

    - name: Ensure uhid module is loaded for gamepad emulation
      become: true
      ansible.builtin.copy:
        dest: /etc/modules-load.d/60-sunshine.conf
        content: uhid
        owner: root
        group: root
        mode: '0644'

    - name: Read the installed NVIDIA driver version
      ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
      register: nvidia_driver
      changed_when: false

    # Blizzard games warn "graphics drivers out of date" under Proton unless
    # DXVK-NVAPI reports a driver version. Encoded as major+minor digits
    # (580.95.05 -> 58095), derived from the real driver so it never goes stale.
    - name: Ensure DXVK_NVAPI_DRIVER_VERSION matches the installed driver
      become: true
      ansible.builtin.lineinfile:
        path: /etc/environment
        line: "DXVK_NVAPI_DRIVER_VERSION={{ nvidia_driver.stdout.split('.')[0] }}{{ nvidia_driver.stdout.split('.')[1] }}"
        regexp: "^DXVK_NVAPI_DRIVER_VERSION="
        state: present

    - name: Add bazzite user to video, input, and render groups
      become: true
      ansible.builtin.user:
        name: bazzite
        groups: video,input,render
        append: true

    # Sunshine (Bazzite 44+): a system Flatpak, as `ujust setup-sunshine
    # enable-flatpak` installs it. (Bazzite 42 shipped an RPM with a plain
    # sunshine.service instead.) The Flatpak's own additional-install.sh uses
    # pkexec prompts, which would hang Ansible, so its three host-side steps are
    # done here directly, from the files shipped inside the Flatpak.
    - name: Install the Sunshine Flatpak (system-wide)
      become: true
      community.general.flatpak:
        name: dev.lizardbyte.app.Sunshine
        method: system
        state: present

    - name: Ensure the user systemd unit directory exists
      ansible.builtin.file:
        path: /home/bazzite/.config/systemd/user
        state: directory
        mode: '0755'

    - name: Install the Sunshine user service shipped in the Flatpak
      ansible.builtin.copy:
        src: "{{ sunshine_files }}/share/sunshine/systemd/user/app-dev.lizardbyte.app.Sunshine.service"
        dest: /home/bazzite/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service
        remote_src: true
        mode: '0644'

    - name: Load uhid now for gamepad emulation (persisted via modules-load.d above)
      become: true
      community.general.modprobe:
        name: uhid
        state: present

    - name: Install Sunshine's udev rule for virtual input devices
      become: true
      ansible.builtin.copy:
        src: "{{ sunshine_files }}/share/sunshine/udev/rules.d/60-sunshine.rules"
        dest: /etc/udev/rules.d/60-sunshine.rules
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      register: sunshine_udev

    - name: Apply the udev rule to existing input devices
      become: true
      ansible.builtin.shell: |
        udevadm control --reload-rules
        udevadm trigger --property-match=DEVNAME=/dev/uinput
        udevadm trigger --property-match=DEVNAME=/dev/uhid
        udevadm trigger --subsystem-match=hidraw
        udevadm trigger --subsystem-match=input
      when: sunshine_udev is changed

    - name: Ensure Sunshine is enabled and running for the bazzite user
      ansible.builtin.systemd_service:
        name: app-dev.lizardbyte.app.Sunshine.service
        scope: user
        daemon_reload: true
        enabled: true
        state: started

    # The VM sits behind KubeVirt masquerade NAT and a MetalLB address, so
    # Sunshine does not recognise https://10.10.20.52:47990 as its own origin and
    # its CSRF protection rejects the web UI (PIN pairing, settings).
    - name: Allow the LAN address as a Sunshine web UI origin
      ansible.builtin.lineinfile:
        path: /home/bazzite/.var/app/dev.lizardbyte.app.Sunshine/config/sunshine/sunshine.conf
        regexp: '^csrf_allowed_origins\s*='
        line: "csrf_allowed_origins = https://{{ ansible_host if ansible_host is match('^[0-9.]+$') else '10.10.20.52' }}:47990"
        create: true
        mode: '0644'
      register: sunshine_conf
      tags: [sunshine]

    # A Flatpak can't use KMS capture, so on KDE Wayland Sunshine goes through
    # the remote-desktop portal, which normally shows an "allow" dialog on the
    # VM's screen (unreachable: no USB passthrough, no VNC in production).
    # Plasma 6.3+ pre-authorization skips it. Must run as the user, not sudo.
    - name: Check Sunshine's remote-desktop portal pre-authorization
      ansible.builtin.command: flatpak permissions kde-authorized remote-desktop
      register: sunshine_portal
      changed_when: false
      failed_when: false
      tags: [sunshine]

    - name: Pre-authorize Sunshine for the KDE remote-desktop portal
      ansible.builtin.command: flatpak permission-set kde-authorized remote-desktop dev.lizardbyte.app.Sunshine yes
      when: "'dev.lizardbyte.app.Sunshine' not in sunshine_portal.stdout"
      register: sunshine_portal_set
      tags: [sunshine]

    - name: Restart Sunshine to pick up its configuration
      ansible.builtin.systemd_service:
        name: app-dev.lizardbyte.app.Sunshine.service
        scope: user
        state: restarted
      when: sunshine_conf is changed or sunshine_portal_set is changed
      tags: [sunshine]

    # Sunshine captures the logged-in desktop. Autologin only takes effect at the
    # next boot, so without this reboot a fresh install sits at the login screen
    # and Sunshine reports "Video failed to find working encoder".
    - name: Reboot so autologin starts the desktop session for Sunshine
      become: true
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: desktop_autologin is changed

    # Streaming-only VM: the KDE lock screen just blocks Moonlight after idle.
    # Access control is Moonlight pairing (and the LAN), not the desktop lock.
    - name: Disable KDE automatic screen locking
      community.general.ini_file:
        path: /home/bazzite/.config/kscreenlockerrc
        section: Daemon
        option: "{{ item }}"
        value: "false"
        no_extra_spaces: true
        mode: '0600'
      loop:
        - Autolock
        - LockOnResume
      tags: [sunshine]

    - name: Check Steam and Flatpak gaming status
      ansible.builtin.command: flatpak list
      register: flatpak_list
      changed_when: false

    - name: Display Installed Gaming Packages
      ansible.builtin.debug:
        var: flatpak_list.stdout_lines

    - name: Ensure user Downloads directory exists
      ansible.builtin.file:
        path: /home/bazzite/Downloads
        state: directory
        owner: bazzite
        group: bazzite
        mode: '0755'
      tags: [blizzard]

    - name: Pre-stage official Battle.net setup installer
      ansible.builtin.get_url:
        url: "https://www.battle.net/download/getInstallerForGame?os=win&gameProgram=BATTLENET_APP&version=Live"
        dest: /home/bazzite/Downloads/Battle.net-Setup.exe
        owner: bazzite
        group: bazzite
        mode: '0755'
      tags: [blizzard]

    - name: Ensure Steam compatibilitytools.d directory exists
      ansible.builtin.file:
        path: /home/bazzite/.local/share/Steam/compatibilitytools.d
        state: directory
        owner: bazzite
        group: bazzite
        mode: '0755'
      tags: [blizzard]

    - name: Download and install latest stable GE-Proton compatibility runner
      ansible.builtin.unarchive:
        src: "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/{{ ge_proton_version }}/{{ ge_proton_version }}.tar.gz"
        dest: /home/bazzite/.local/share/Steam/compatibilitytools.d/
        remote_src: true
        creates: /home/bazzite/.local/share/Steam/compatibilitytools.d/{{ ge_proton_version }}
        owner: bazzite
        group: bazzite
      tags: [blizzard]

    - name: Verify installed Steam compatibility tools
      ansible.builtin.command: ls -la /home/bazzite/.local/share/Steam/compatibilitytools.d/
      register: compat_tools
      changed_when: false

    - name: Display Installed Compatibility Tools
      ansible.builtin.debug:
        var: compat_tools.stdout_lines

    # Steam games: no steamcmd (it would need the Steam password and a Steam
    # Guard code). Instead, drop a stub appmanifest per game with StateFlags
    # 1026 ("update required"); on its next start the logged-in client treats
    # the game as installed-but-outdated and downloads it. Steam overwrites the
    # stub with the real manifest, and `force: false` never touches it again.
    - name: Check which Steam games already have an app manifest
      ansible.builtin.stat:
        path: "{{ steam_library }}/appmanifest_{{ item.appid }}.acf"
      loop: "{{ steam_apps }}"
      loop_control:
        label: "{{ item.name }}"
      register: steam_manifests
      tags: [steam-games]

    # Steam rewrites steamapps/ on exit, so it must be stopped while stubs are
    # written. It runs as the KDE autostart unit of the desktop session.
    - name: Stop Steam before queueing new installs
      ansible.builtin.systemd_service:
        name: app-steam@autostart.service
        scope: user
        state: stopped
      when: steam_manifests.results | rejectattr('stat.exists') | list | length > 0
      register: steam_stopped
      tags: [steam-games]

    - name: Queue Steam game installs with stub app manifests
      ansible.builtin.copy:
        dest: "{{ steam_library }}/appmanifest_{{ item.item.appid }}.acf"
        content: |
          "AppState"
          {
          	"appid"		"{{ item.item.appid }}"
          	"Universe"		"1"
          	"name"		"{{ item.item.name }}"
          	"StateFlags"		"1026"
          	"installdir"		"{{ item.item.name }}"
          }
        force: false
        mode: '0644'
      loop: "{{ steam_manifests.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not item.stat.exists
      tags: [steam-games]

    - name: Start Steam so it picks up the queued installs
      ansible.builtin.systemd_service:
        name: app-steam@autostart.service
        scope: user
        state: started
      when: steam_stopped is changed
      tags: [steam-games]

    - name: Ensure user local bin directory exists
      ansible.builtin.file:
        path: /home/bazzite/.local/bin
        state: directory
        owner: bazzite
        group: bazzite
        mode: '0755'
      tags: [blizzard]

    - name: Deploy Steam shortcut synchronization script
      ansible.builtin.copy:
        src: ../files/sync_steam_shortcuts.py
        dest: /home/bazzite/.local/bin/sync-steam-shortcuts.py
        owner: bazzite
        group: bazzite
        mode: '0755'
      tags: [blizzard]

    # DevilutionX: native Linux port of Diablo/Hellfire, playing the data files
    # from the Battle.net install (the 1996 game's menus render white under
    # Wine). The Flatpak sandbox only sees its own data dir, so the MPQs are
    # hardlinked in: same file on disk, no extra space, readable in the sandbox.
    - name: Check for the Battle.net Diablo install
      ansible.builtin.stat:
        path: "{{ bnet_program_files }}/Diablo/DIABDAT.MPQ"
      register: diablo_data
      tags: [blizzard]

    - name: Install the DevilutionX Flatpak (system-wide)
      become: true
      community.general.flatpak:
        name: org.diasurgical.DevilutionX
        method: system
        state: present
      when: diablo_data.stat.exists
      tags: [blizzard]

    - name: Ensure the DevilutionX data directory exists
      ansible.builtin.file:
        path: "{{ devilutionx_data }}"
        state: directory
        mode: '0755'
      when: diablo_data.stat.exists
      tags: [blizzard]

    - name: Hardlink the Diablo and Hellfire MPQs into DevilutionX's data dir
      ansible.builtin.file:
        src: "{{ bnet_program_files }}/Diablo/{{ item.src }}"
        dest: "{{ devilutionx_data }}/{{ item.dest }}"
        state: hard
      loop:
        - { src: DIABDAT.MPQ, dest: diabdat.mpq }
        - { src: HELLFIRE/hellfire.mpq, dest: hellfire.mpq }
        - { src: HELLFIRE/hfmonk.mpq, dest: hfmonk.mpq }
        - { src: HELLFIRE/hfmusic.mpq, dest: hfmusic.mpq }
        - { src: HELLFIRE/hfvoice.mpq, dest: hfvoice.mpq }
      loop_control:
        label: "{{ item.dest }}"
      when: diablo_data.stat.exists
      tags: [blizzard]

    # Two passes (see the script's docstring and docs/303 Step 7). Before
    # Battle.net is installed this creates a "Battle.net" shortcut that runs the
    # setup exe in the shared prefix; after, it adds one shortcut per installed
    # Blizzard game. A dry run decides whether Steam has to be stopped.
    - name: Check whether Battle.net / Blizzard shortcuts need changes
      ansible.builtin.command: python3 /home/bazzite/.local/bin/sync-steam-shortcuts.py --check
      register: bnet_check
      changed_when: false
      tags: [blizzard]

    - name: Show pending Battle.net / Blizzard shortcut changes
      ansible.builtin.debug:
        var: bnet_check.stdout_lines
      tags: [blizzard]

    - name: Apply Battle.net / Blizzard shortcuts with Steam stopped
      when: "'CHANGES_PENDING' in bnet_check.stdout"
      tags: [blizzard]
      block:
        # Stopping the unit also stops Battle.net and any game Steam launched
        # (same cgroup), so their config files are not rewritten underneath us.
        - name: Stop Steam before editing its shortcuts and config
          ansible.builtin.systemd_service:
            name: app-steam@autostart.service
            scope: user
            state: stopped

        - name: Sync Battle.net / Blizzard shortcuts into Steam
          ansible.builtin.command: python3 /home/bazzite/.local/bin/sync-steam-shortcuts.py
          register: bnet_sync
          changed_when: true

        - name: Show applied shortcut changes
          ansible.builtin.debug:
            var: bnet_sync.stdout_lines
      always:
        - name: Start Steam again
          ansible.builtin.systemd_service:
            name: app-steam@autostart.service
            scope: user
            state: started


