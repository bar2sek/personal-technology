name: "Terraform Lint & Validate CI"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "bootstrap/**"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "bootstrap/**"

permissions:
  contents: read

# Runs on an ephemeral GitHub-hosted runner, never the self-hosted ARC runner:
# this repository is public, and `pull_request` executes untrusted fork code.
# Nothing here needs homelab network access.
jobs:
  validate:
    name: "Validate Terraform Configurations"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - "terraform/unifi"
          - "bootstrap/aws"
          - "bootstrap/aws_organization"
          - "bootstrap/azure"
          - "bootstrap/github"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ${{ matrix.dir }}

      - name: Terraform Init (Backend disabled for validation)
        run: terraform init -backend=false
        working-directory: ${{ matrix.dir }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}
