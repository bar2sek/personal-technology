# Landing zones MG: same removals as platform, plus the workload-only ones.
name: homelab_landing_zones
base_archetype: landing_zones
policy_assignments_to_remove:
  - Deploy-MDFC-DefSQL-AMA
  - Deploy-VM-ChangeTrack
  - Deploy-VMSS-ChangeTrack
  - Deploy-vmArc-ChangeTrack
  - Deploy-VM-Monitoring
  - Deploy-VMSS-Monitoring
  - Deploy-vmHybr-Monitoring
  - Deploy-AzSqlDb-Auditing   # SQL auditing into Log Analytics
  - Deploy-SQL-Threat         # SQL Advanced Threat Protection = Defender for SQL (paid)
  - Deploy-VM-Backup          # Recovery Services vault + fees
  - Enable-DDoS-VNET          # DDoS Network Protection plan
  # --- M5 trim (docs/417 "Trim"): rule = an assignment WITHOUT a managed identity
  # (Audit/Deny only) stays; one WITH an identity stays only if it targets a
  # service on the roadmap (docs/411). Each of these held standing write roles
  # (often Contributor) on the whole MG for services the lab will not run.
  # Definitions stay on the root, so re-adding one is deleting its line here.
  - Enforce-GR-BotService0
  - Enforce-GR-CogServ0
  - Enforce-GR-OpenAI0
  - Enforce-GR-MachLearn0
  - Enforce-GR-CosmosDb0      # also had a paid Defender member
  - Enforce-GR-MySQL0         # also had a paid Defender member
  - Enforce-GR-PostgreSQL0    # also had a paid Defender member
  - Enforce-GR-SQL0           # also had a paid Defender member
  - Enforce-GR-Synapse0       # also had a paid Defender member
  - Enforce-GR-DataExpl0
  - Enforce-GR-DataFactory0
  - Enforce-GR-EventHub0      # identity held Event Hubs Data Owner
  - Enforce-GR-ServiceBus0    # identity held Service Bus Data Owner
  - Enforce-GR-EventGrid0
  - Enforce-GR-APIM0
  - Enforce-GR-VirtualDesk0
  - Enforce-GR-Kubernetes0    # AKS only; the lab runs Talos + Arc
  - Enforce-GR-Automation0
  - Enforce-GR-ContInst0
  - Enforce-Encrypt-CMK0      # customer-managed keys: not planned
  - Enable-AUM-CheckUpdates   # VMs/Arc servers only; Update Manager bills Arc servers
  - Deploy-GuestAttest        # Trusted Launch VMs only; no VMs planned
  - Deploy-SQL-TDE            # SQL only; identity held SQL DB Contributor
