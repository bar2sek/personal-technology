# ==============================================================================
# Declarative Machine Install Disk Configurations for Sidero Omni
# Pins each node to its dedicated OS drive to protect bulk & Ceph storage drives.
#
# Every entry selects its disk by WWID (world-wide name), never by /dev/sdX:
#   - Linux assigns sdX letters in discovery order, so they shift whenever a
#     disk is added, removed or moved to another port (seen in Waves 1-3b of
#     docs/110).
#   - Talos reports no serial for any SATA disk here, and model alone is not
#     unique (sm-node-03 has two SuperDOMs), so the factory WWID is the only
#     stable per-disk identifier.
#   - Omni writes the chosen disk into machine.install.disk, which takes
#     precedence over any install.diskSelector in the cluster template.
# Find a WWID with: talosctl -n <node-ip> get disks
# Verify with:      omnictl get machineinstalldiskstatus
# ==============================================================================

# sm-node-01 (Control Plane 1): 16GB SATA SuperDOM
metadata:
  namespace: default
  type: MachineInstallDiskConfigs.omni.sidero.dev
  id: da165a00-3e5d-11ea-8000-3cecef44a132
spec:
  disk: ""
  diskselector: 'disk.wwid == "naa.515d90720a000088"'
---
# sm-node-02 (Control Plane 2): 16GB SATA SuperDOM
metadata:
  namespace: default
  type: MachineInstallDiskConfigs.omni.sidero.dev
  id: 9983ae00-e364-11ea-8000-3cecef6fd61e
spec:
  disk: ""
  diskselector: 'disk.wwid == "naa.515d90720a000103"'
---
# sm-node-03 (Control Plane 3): 16GB SATA SuperDOM (sde on 2026-10-19).
# This node has a SECOND SuperDOM (sdf, WWID naa.515d94519a000032) with an old
# non-Talos install, so a model selector would match two disks.
metadata:
  namespace: default
  type: MachineInstallDiskConfigs.omni.sidero.dev
  id: 00000000-0000-0000-0000-3cecef58ed64
spec:
  disk: ""
  diskselector: 'disk.wwid == "naa.515d93419a000069"'
---
# pc-node-04 (Storage Worker): 80GB Intel 320 SSD (preserves all bulk HDDs)
metadata:
