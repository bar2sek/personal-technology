kind: Cluster
name: homelab-k8s
kubernetes:
  version: v1.36.4
talos:
  version: v1.13.10
patches:
  - name: cluster-common
    inline: |-
      cluster:
        allowSchedulingOnControlPlanes: true
        apiServer:
          certSANs:
            - 10.10.20.1
            - 10.10.20.10
            - 10.10.20.11
            - 10.10.20.12
            - 10.10.20.13
            - 10.10.20.20
            - 10.10.20.111
            - 10.10.20.120
            - 10.10.20.131
            - 10.10.20.199
            - 10.10.40.20
            - 10.10.40.111
            - 10.10.40.120
            - 10.10.40.131
            - 10.10.40.199
            - sm-node-01
            - sm-node-02
            - sm-node-03
            - pc-node-04
            - pc-node-05
            - k8s.bar2sek.com
            - cluster.local
      machine:
        kernel:
          modules:
            - name: rbd
            - name: ceph
        features:
          rbac: true
        kubelet:
          nodeIP:
            validSubnets:
              - 10.10.20.0/24
          extraMounts:
            - destination: /var/lib/rook
              type: bind
              source: /var/lib/rook
              options:
                - bind
                - rshared
---
kind: ControlPlane
machines:
  - da165a00-3e5d-11ea-8000-3cecef44a132
  - 9983ae00-e364-11ea-8000-3cecef6fd61e
  - 00000000-0000-0000-0000-3cecef58ed64
patches:
  - name: controlplane-api-access
    inline: |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:reader
            allowedKubernetesNamespaces:
              - kube-system
  # The Supermicro nodes boot from 16 GB SuperDOMs, leaving only 12.5 GiB for
  # /var (images, logs, Ceph mon store). The kubelet's default image GC (start at
  # 85%, stop at 80%) leaves <2 GiB headroom there, which caused pod evictions
  # during image pulls and keeps Ceph's MON_DISK_LOW (<30% free) warning on.
  # Clean up earlier, and drop unused images after a week regardless of space.
  - name: controlplane-image-gc
    inline: |-
      machine:
        kubelet:
          extraConfig:
            imageGCHighThresholdPercent: 60
            imageGCLowThresholdPercent: 50
            imageMaximumGCAge: 168h

---
kind: Workers
machines:
  - 927ef8ab-872a-f416-acb4-2cf05d577ea4
  - 7a7d25b8-0dfc-c810-a348-047c1680b262
---
kind: Machine
name: da165a00-3e5d-11ea-8000-3cecef44a132
patches:
  - name: sm-node-01-config
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: sm-node-01
      ---
      machine:
        network:
          nameservers:
            - 10.10.20.1
            - 10.0.1.1
          interfaces:
            - interface: eno7np2
              addresses:
                - 10.10.20.199/24
              routes:
                - network: 0.0.0.0/0
                  gateway: 10.10.20.1
              vip:
                ip: 10.10.20.10
            - interface: eno8np3
              mtu: 9000
              dhcp: true
              vlans:
                - vlanId: 40
                  mtu: 9000
                  addresses:
                    - 10.10.40.199/24
      ---
      # Wave 7 (docs/110, 2026-10-19): /var off the 16 GB SuperDOM onto a fixed
      # 250 GiB slice of the 2 TB Sabrent NVMe (serial: NVMe reports it in
      # Talos). The RawVolumeConfig "osd-nvme" for the rest of the disk is
      # added only AFTER the reset, once EPHEMERAL exists (see sm-node-02).
      apiVersion: v1alpha1
      kind: VolumeConfig
      name: EPHEMERAL
      provisioning:
        diskSelector:
          match: disk.serial == "BC7107061E7C02090817"
        minSize: 250GiB
        maxSize: 250GiB
        grow: false
      ---
      # Added after the Wave 7 reset, once EPHEMERAL existed on the Sabrent
      # (a RawVolumeConfig is provisioned immediately; see sm-node-02).
      apiVersion: v1alpha1
      kind: RawVolumeConfig
      name: osd-nvme # partition label r-osd-nvme; must not contain "ceph"
      provisioning:
        diskSelector:
          match: disk.serial == "BC7107061E7C02090817"
        minSize: 1TiB
        grow: true
---
kind: Machine
name: 9983ae00-e364-11ea-8000-3cecef6fd61e
patches:
  - name: sm-node-02-config
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: sm-node-02
      ---
      machine:
        network:
          nameservers:
            - 10.10.20.1
            - 10.0.1.1
          interfaces:
            - interface: eno7np2
              addresses:
                - 10.10.20.120/24
              routes:
                - network: 0.0.0.0/0
                  gateway: 10.10.20.1
              vip:
                ip: 10.10.20.10
            - interface: eno8np3
              mtu: 9000
              dhcp: true
              vlans:
                - vlanId: 40
                  mtu: 9000
                  addresses:
                    - 10.10.40.120/24
      ---
      # Wave 6 (docs/110, 2026-10-19): /var off the 16 GB SuperDOM. The node
      # has no free SATA port, so the 2 TB Sabrent NVMe is split: a fixed
      # 250 GiB EPHEMERAL, and the rest as an unformatted partition for a Ceph
      # OSD (/dev/disk/by-partlabel/r-osd-nvme in cluster.yaml). NVMe reports
      # its serial in Talos (SATA disks do not), so select by serial. Only
      # takes effect when the volumes are (re)created after an Omni reset.
      apiVersion: v1alpha1
      kind: VolumeConfig
      name: EPHEMERAL
      provisioning:
        diskSelector:
          match: disk.serial == "F2C10719080B00006324"
        minSize: 250GiB
        maxSize: 250GiB
        grow: false
      ---
      # Raw (unformatted) partition in the rest of the Sabrent for the Ceph OSD.
      # ORDER MATTERS: a RawVolumeConfig is a user volume and is provisioned as
      # soon as it is synced. Add it only AFTER EPHEMERAL exists on this disk,
      # or grow: true takes the whole blank disk and EPHEMERAL has no room
      # after the reset (Wave 6, 2026-10-19).
      apiVersion: v1alpha1
      kind: RawVolumeConfig
      name: osd-nvme # partition label r-osd-nvme; must not contain "ceph"
      provisioning:
        diskSelector:
          match: disk.serial == "F2C10719080B00006324"
        minSize: 1TiB
        grow: true
---
kind: Machine
name: 00000000-0000-0000-0000-3cecef58ed64
patches:
  - name: sm-node-03-config
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: sm-node-03
      ---
      machine:
        network:
          nameservers:
            - 10.10.20.1
            - 10.0.1.1
          interfaces:
            - interface: ens6f0
              addresses:
                - 10.10.20.131/24
              routes:
                - network: 0.0.0.0/0
                  gateway: 10.10.20.1
              vip:
                ip: 10.10.20.10
            - interface: ens6f1
              mtu: 9000
              dhcp: true
              vlans:
                - vlanId: 40
                  mtu: 9000
                  addresses:
                    - 10.10.40.131/24
      ---
      # /var off the 16 GB SuperDOM onto the whole 250 GB MX500 (Wave 4,
      # docs/110). Selected by WWID: Talos reports no serial for SATA disks.
      # Only takes effect when EPHEMERAL is (re)created, i.e. after an Omni
      # reset; a no-op on the running node.
      apiVersion: v1alpha1
      kind: VolumeConfig
      name: EPHEMERAL
      provisioning:
        diskSelector:
          match: disk.wwid == "naa.500a0751e6489822"
        minSize: 200GiB
        grow: true

---
kind: Machine
name: 927ef8ab-872a-f416-acb4-2cf05d577ea4
patches:
  - name: storage-worker
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: pc-node-04
      ---
      machine:
        network:
          nameservers:
            - 10.10.20.1
            - 10.0.1.1
          interfaces:
            - interface: enp43s0f0
              addresses:
                - 10.10.20.20/24
              routes:
                - network: 0.0.0.0/0
                  gateway: 10.10.20.1
            - interface: enp43s0f1
              mtu: 9000
              dhcp: true
              vlans:
                - vlanId: 40
                  mtu: 9000
                  addresses:
                    - 10.10.40.20/24
        nodeLabels:
          node.kubernetes.io/role: storage-worker
          storage.homelab/tier3-hdd: "true"
---
kind: Machine
name: 7a7d25b8-0dfc-c810-a348-047c1680b262
patches:
  - name: gpu-worker
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: pc-node-05
      ---
      machine:
        install:
          # Install disk (the Kingston SSD) is pinned per machine in
          # talos/machine-install-disks.yaml, not here: Omni writes its choice
          # into install.disk, which overrides an install.diskSelector.
          extraKernelArgs:
            - amd_iommu=on
            - iommu=pt
            - vfio-pci.ids=10de:2786,10de:22bc
        kernel:
          modules:
            - name: vfio
            - name: vfio_iommu_type1
            - name: vfio-pci
              parameters:
                - ids=10de:2786,10de:22bc
        sysctls:
          vm.nr_hugepages: "0"
        network:
          nameservers:
            - 10.10.20.1
            - 10.0.1.1
          # One NIC carries both VLANs, both tagged (switch port: native VLAN
          # none, tagged 20 + 40). The parent stays at 9000 with no address so
          # VLAN 40 can use jumbo frames; VLAN 20 is its own 1500-byte link.
          # flannel derives the pod MTU from the default-route link, so this
          # gives cni0 = 1450 like the other nodes (route MTUs don't count).
          interfaces:
            - interface: enp12s0
              mtu: 9000
              vlans:
                - vlanId: 20
                  mtu: 1500
                  addresses:
                    - 10.10.20.111/24
                  routes:
                    - network: 0.0.0.0/0
                      gateway: 10.10.20.1
                - vlanId: 40
                  mtu: 9000
                  addresses:
                    - 10.10.40.111/24
        nodeLabels:
          node.kubernetes.io/role: gpu-worker
          nvidia.com/gpu.present: "true"
  # Local storage for the gaming VM's disk, mounted at /var/mnt/gaming-vm. The
  # VM is pinned here by GPU passthrough anyway, and game files do not need
  # Ceph replication. Since Wave 3b (2026-10-18, docs/110) Talos boots from the
  # Kingston SSD, so the whole Sabrent NVMe is this one partition. Matched by
  # serial: nvme0n1/nvme1n1 swap between boots on this board.
  - name: gpu-worker-volumes
    inline: |-
      apiVersion: v1alpha1
      kind: UserVolumeConfig
      name: gaming-vm
      provisioning:
        diskSelector:
          match: disk.serial == "03850709175D88299755"
        minSize: 900GiB
        grow: true
      filesystem:
        type: xfs

