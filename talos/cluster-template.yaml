kind: Cluster
name: homelab-k8s
kubernetes:
  version: v1.36.4
talos:
  version: v1.13.10
patches:
  - name: cluster-common
    inline: |-
      cluster:
        allowSchedulingOnControlPlanes: true
        apiServer:
          certSANs:
            - 10.10.20.1
            - 10.10.20.10
            - 10.10.20.11
            - 10.10.20.12
            - 10.10.20.13
            - 10.10.20.20
            - 10.10.20.111
            - 10.10.20.120
            - 10.10.20.131
            - 10.10.20.199
            - sm-node-01
            - sm-node-02
            - sm-node-03
            - pc-node-04
            - pc-node-05
            - k8s.bar2sek.com
            - cluster.local
      machine:
        kernel:
          modules:
            - name: rbd
            - name: ceph
        kubelet:
          extraMounts:
            - destination: /var/lib/rook
              type: bind
              source: /var/lib/rook
              options:
                - bind
                - rshared
---
kind: ControlPlane
machines:
  - da165a00-3e5d-11ea-8000-3cecef44a132
  - 9983ae00-e364-11ea-8000-3cecef6fd61e
  - 00000000-0000-0000-0000-3cecef58ed64
---
kind: Workers
machines:
  - 927ef8ab-872a-f416-acb4-2cf05d577ea4
  - 7a7d25b8-0dfc-c810-a348-047c1680b262
---
kind: Machine
name: da165a00-3e5d-11ea-8000-3cecef44a132
patches:
  - name: hostname-sm-node-01
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: sm-node-01
---
kind: Machine
name: 9983ae00-e364-11ea-8000-3cecef6fd61e
patches:
  - name: hostname-sm-node-02
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: sm-node-02
---
kind: Machine
name: 00000000-0000-0000-0000-3cecef58ed64
patches:
  - name: hostname-sm-node-03
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: sm-node-03
---
kind: Machine
name: 927ef8ab-872a-f416-acb4-2cf05d577ea4
patches:
  - name: storage-worker
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: pc-node-04
      ---
      machine:
        nodeLabels:
          node.kubernetes.io/role: storage-worker
          storage.homelab/tier3-hdd: "true"
---
kind: Machine
name: 7a7d25b8-0dfc-c810-a348-047c1680b262
patches:
  - name: gpu-worker
    inline: |-
      apiVersion: v1alpha1
      kind: HostnameConfig
      auto: "off"
      hostname: pc-node-05
      ---
      machine:
        install:
          extraKernelArgs:
            - amd_iommu=on
            - iommu=pt
            - vfio-pci.ids=10de:2786,10de:22bc
        nodeLabels:
          node.kubernetes.io/role: gpu-worker
          nvidia.com/gpu.present: "true"
